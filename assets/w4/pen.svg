<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 60" width="640" height="60">
  <!-- a blue ballpoint with gold bands, lying lengthways (drawn from the reference photo) -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16307a"/>
      <stop offset=".28" stop-color="#4a6fd0"/>
      <stop offset=".45" stop-color="#2c4ca8"/>
      <stop offset="1" stop-color="#0f2260"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a22"/>
      <stop offset=".3" stop-color="#f4dc92"/>
      <stop offset=".55" stop-color="#c79c3c"/>
      <stop offset="1" stop-color="#6e5216"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d9196"/>
      <stop offset=".35" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#6c7075"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-40%" width="110%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1b1a16" flood-opacity=".28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- tip -->
    <path d="M6 30 L40 22 L40 38 Z" fill="url(#steel)"/>
    <circle cx="6" cy="30" r="1.6" fill="#2a2a2a"/>
    <!-- grip -->
    <path d="M40 20 H120 V40 H40 Z" fill="url(#body)"/>
    <!-- band -->
    <rect x="120" y="18.5" width="12" height="23" rx="1.5" fill="url(#gold)"/>
    <!-- barrel -->
    <path d="M132 18 H468 V42 H132 Z" fill="url(#body)"/>
    <!-- crest, a little gold mark on the barrel -->
    <circle cx="420" cy="30" r="5" fill="none" stroke="#c9a24a" stroke-width="1.2" opacity=".8"/>
    <!-- bands -->
    <rect x="468" y="17" width="16" height="26" rx="2" fill="url(#gold)"/>
    <rect x="488" y="17.5" width="5" height="25" rx="1.5" fill="url(#gold)"/>
    <!-- cap -->
    <path d="M493 17.5 H612 Q630 17.5 630 30 Q630 42.5 612 42.5 H493 Z" fill="url(#body)"/>
    <!-- clip -->
    <path d="M512 13 H606 Q616 13 616 18 L612 19 H512 Z" fill="url(#gold)"/>
    <rect x="512" y="11" width="10" height="8" rx="2" fill="url(#gold)"/>
  </g>
</svg>
